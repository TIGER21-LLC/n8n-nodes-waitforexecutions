# Copy to .github/workflows/security.yml. Dependabot (github-actions) bumps the pinned SHA.
name: security

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday 06:17 UTC: full-history Gitleaks scan
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    uses: TIGER21-LLC/security-workflows/.github/workflows/security-scan.yml@afee9c9f69fb0ab427355f72c060094fbf89c9e6 # v0.2.0
    with:
      # image: ghcr.io/tiger21-llc/<app>:<tag>  # optional, must be pullable by the runner
      fail_on: none                           # report-only (first two weeks of rollout)
